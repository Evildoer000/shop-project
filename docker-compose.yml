x-backend-env: &backend-env
  APP_ENV: docker
  DATABASE_URL: postgresql+psycopg://rag:rag@postgres:5432/ecommerce_rag
  MILVUS_URI: http://milvus:19530
  MILVUS_TOKEN: ${MILVUS_TOKEN:-}
  MILVUS_COLLECTION: ${MILVUS_COLLECTION:-product_chunks}
  TEXT_MILVUS_COLLECTION: ${TEXT_MILVUS_COLLECTION:-product_chunks}
  IMAGE_MILVUS_COLLECTION: ${IMAGE_MILVUS_COLLECTION:-product_image_chunks}
  ELASTICSEARCH_ENABLED: ${ELASTICSEARCH_ENABLED:-true}
  ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:-http://elasticsearch:9200}
  ELASTICSEARCH_INDEX: ${ELASTICSEARCH_INDEX:-products}
  ELASTICSEARCH_TIMEOUT_SECONDS: ${ELASTICSEARCH_TIMEOUT_SECONDS:-10}
  ORGANIZER_DATASET_DIR: /data/ecommerce_agent_dataset
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_BASE_URL: ${LLM_BASE_URL:-}
  LLM_MODEL: ${LLM_MODEL:-deepseek-v4-flash}
  LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
  LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
  LLM_RETRY_BACKOFF_SECONDS: ${LLM_RETRY_BACKOFF_SECONDS:-0.8}
  LLM_THINKING_TYPE: ${LLM_THINKING_TYPE:-disabled}
  EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
  EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
  EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
  EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-30}
  DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
  IMAGE_EMBEDDING_BACKEND: ${IMAGE_EMBEDDING_BACKEND:-dashscope}
  IMAGE_EMBEDDING_API_KEY: ${IMAGE_EMBEDDING_API_KEY:-}
  IMAGE_EMBEDDING_MODEL: ${IMAGE_EMBEDDING_MODEL:-tongyi-embedding-vision-flash-2026-03-06}
  CLIP_MODEL_NAME: ${CLIP_MODEL_NAME:-ViT-B-16}
  CLIP_DEVICE: ${CLIP_DEVICE:-auto}
  IMAGE_EMBEDDING_DIM: ${IMAGE_EMBEDDING_DIM:-768}
  IMAGE_RELEVANCE_THRESHOLD: ${IMAGE_RELEVANCE_THRESHOLD:-0.20}
  VLM_API_KEY: ${VLM_API_KEY:-}
  VLM_BASE_URL: ${VLM_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3}
  VLM_MODEL: ${VLM_MODEL:-ep-20260617162507-dxgg2}
  VLM_TIMEOUT_SECONDS: ${VLM_TIMEOUT_SECONDS:-10}
  VLM_MAX_RETRIES: ${VLM_MAX_RETRIES:-0}
  EVIDENCE_CACHE_TTL_SECONDS: ${EVIDENCE_CACHE_TTL_SECONDS:-3600}
  EVIDENCE_CACHE_RECENT_TURNS: ${EVIDENCE_CACHE_RECENT_TURNS:-20}
  EVIDENCE_CACHE_MAX_CANDIDATES_PER_TURN: ${EVIDENCE_CACHE_MAX_CANDIDATES_PER_TURN:-20}
  RERANK_BACKEND: ${RERANK_BACKEND:-hybrid}
  RERANK_API_KEY: ${RERANK_API_KEY:-}
  RERANK_BASE_URL: ${RERANK_BASE_URL:-}
  RERANK_MODEL: ${RERANK_MODEL:-}
  RERANK_TIMEOUT_SECONDS: ${RERANK_TIMEOUT_SECONDS:-30}
  MULTI_AGENT_RUNTIME_ENABLED: ${MULTI_AGENT_RUNTIME_ENABLED:-true}
  COMMERCE_MCP_URL: ${COMMERCE_MCP_URL:-http://commerce-mcp:8787}
  COMMERCE_MCP_TIMEOUT_SECONDS: ${COMMERCE_MCP_TIMEOUT_SECONDS:-15}
  WEB_SEARCH_ENDPOINT: ${WEB_SEARCH_ENDPOINT:-http://commerce-mcp:8787/v1/web/search}
  WEB_SEARCH_API_KEY: ${WEB_SEARCH_API_KEY:-}
  WEB_SEARCH_TIMEOUT_SECONDS: ${WEB_SEARCH_TIMEOUT_SECONDS:-15}
  ENABLE_TRAJECTORY_LOG: ${ENABLE_TRAJECTORY_LOG:-true}
  TRAJECTORY_LOG_PATH: /app/logs/multihop_trajectories.jsonl
  LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
  LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
  LANGFUSE_HOST: ${LANGFUSE_HOST:-}
  BOOTSTRAP_WAIT_SECONDS: ${BOOTSTRAP_WAIT_SECONDS:-180}
  BOOTSTRAP_FORCE_REINDEX: ${BOOTSTRAP_FORCE_REINDEX:-false}
  BOOTSTRAP_FORCE_ES_REINDEX: ${BOOTSTRAP_FORCE_ES_REINDEX:-false}
  BOOTSTRAP_FORCE_IMAGE_REINDEX: ${BOOTSTRAP_FORCE_IMAGE_REINDEX:-false}

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ecommerce-rag-postgres
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: ecommerce_rag
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d ecommerce_rag"]
      interval: 5s
      timeout: 3s
      retries: 20

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: ecommerce-rag-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - etcd_data:/etcd

  minio:
    image: minio/minio:latest
    container_name: ecommerce-rag-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: minio server /minio_data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/minio_data

  milvus:
    image: dockerproxy.net/milvusdb/milvus:v2.5.12
    container_name: ecommerce-rag-milvus
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio
    volumes:
      - milvus_data:/var/lib/milvus

  elasticsearch:
    build:
      context: ./elasticsearch
      dockerfile: Dockerfile
    image: shop-agent-elasticsearch:8.15.5-ik
    container_name: ecommerce-rag-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  commerce-mcp:
    build:
      context: ./justoneapi-mcp-main
      dockerfile: Dockerfile.bridge
    image: shop-agent-commerce-mcp:latest
    container_name: ecommerce-rag-commerce-mcp
    environment:
      JUSTONEAPI_TOKEN: ${JUSTONEAPI_TOKEN:-}
      JUSTONEAPI_BASE_URL: ${JUSTONEAPI_BASE_URL:-https://api.justoneapi.com}
      JUSTONEAPI_SEARCH_V2_ENABLED: ${JUSTONEAPI_SEARCH_V2_ENABLED:-true}
      JUSTONEAPI_TIMEOUT_MS: ${JUSTONEAPI_TIMEOUT_MS:-60000}
      JUSTONEAPI_RETRY: ${JUSTONEAPI_RETRY:-1}
      BAIDU_WEB_SEARCH_MCP_URL: ${BAIDU_WEB_SEARCH_MCP_URL:-}
      BAIDU_WEB_SEARCH_MCP_TOKEN: ${BAIDU_WEB_SEARCH_MCP_TOKEN:-}
      BAIDU_WEB_SEARCH_MCP_TOOL_NAME: ${BAIDU_WEB_SEARCH_MCP_TOOL_NAME:-web_search}
      BAIDU_WEB_SEARCH_MCP_TIMEOUT_MS: ${BAIDU_WEB_SEARCH_MCP_TIMEOUT_MS:-30000}
      BRIDGE_PORT: 8787
    ports:
      - "8787:8787"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend-bootstrap:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ecommerce-rag-backend-bootstrap
    command: ["python", "scripts/docker_bootstrap.py"]
    dns:
      - 223.5.5.5
      - 114.114.114.114
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      etcd:
        condition: service_started
      minio:
        condition: service_started
      milvus:
        condition: service_started
      commerce-mcp:
        condition: service_healthy
    volumes:
      - ./ecommerce_agent_dataset:/data/ecommerce_agent_dataset:ro
      - backend_logs:/app/logs
      - backend_uploads:/data/uploads
    restart: "no"

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ecommerce-rag-backend
    environment:
      <<: *backend-env
    dns:
      - 223.5.5.5
      - 114.114.114.114
    ports:
      - "8000:8000"
    depends_on:
      backend-bootstrap:
        condition: service_completed_successfully
    volumes:
      - ./ecommerce_agent_dataset:/data/ecommerce_agent_dataset:ro
      - backend_logs:/app/logs
      - backend_uploads:/data/uploads
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()",
        ]
      interval: 10s
      timeout: 3s
      retries: 20

  evaluator:
    profiles: ["eval"]
    build:
      context: ./server
      dockerfile: Dockerfile.eval
    image: shop-agent-evaluator:latest
    container_name: ecommerce-rag-evaluator
    working_dir: /workspace
    environment:
      <<: *backend-env
      PYTHONPATH: /workspace/server:/workspace
      DEEPEVAL_TELEMETRY_OPT_OUT: "YES"
      DEEPEVAL_DISABLE_DOTENV: "1"
      LLM_INPUT_PRICE_PER_1K: ${LLM_INPUT_PRICE_PER_1K:-0}
      LLM_OUTPUT_PRICE_PER_1K: ${LLM_OUTPUT_PRICE_PER_1K:-0}
    volumes:
      - ./:/workspace
      - ./ecommerce_agent_dataset:/data/ecommerce_agent_dataset:ro
    command:
      [
        "python",
        "-m",
        "pytest",
        "-c",
        "benchmark/v2/pytest.ini",
        "benchmark/v2/tests",
        "-m",
        "not semantic",
        "-q",
      ]

volumes:
  postgres_data:
  etcd_data:
  minio_data:
  milvus_data:
  elasticsearch_data:
  backend_logs:
  backend_uploads:
